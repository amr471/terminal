name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint · Build · Test (TS workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # TODO(F0.6): add Go job for services/market-data (gofmt + go vet + go test)
  # TODO(P1.x): add Python job for services/quant and services/ai (ruff + pytest)
