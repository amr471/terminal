name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint · Build · Test (TS workspaces)
    runs-on: ubuntu-latest
    # Postgres+TimescaleDB and Redis so api-gateway's auth integration tests
    # (P1.1: session.test.ts, app.test.ts) run for real instead of skipping —
    # same images/versions as docker-compose.yml (P1.0).
    services:
      postgres:
        image: timescale/timescaledb:2.28.2-pg17
        env:
          POSTGRES_DB: terminal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations + set local service-role passwords
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/terminal
        run: |
          ./db/migrate.sh
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v pass="'ci_test_only'" -f db/dev/set-passwords.sql
      - name: Test
        env:
          DATABASE_URL_API_GATEWAY: postgres://svc_api_gateway:ci_test_only@localhost:5432/terminal
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-test-session-secret-not-a-real-secret
        run: pnpm test

  # TODO(F0.6): add Go job for services/market-data (gofmt + go vet + go test)
  # TODO(P1.x): add Python job for services/quant and services/ai (ruff + pytest)
